# SonarQube Configuration for sydent-ibm-wxo-agents

# Required project identification - MUST MATCH BAMBOO CONFIGURATION
sonar.projectKey=sydent-ibm-wxo-agents
sonar.projectName=sydent-ibm-wxo-agents
sonar.projectVersion=1.0
sonar.host.url=https://sonarqube.elevancehealth.com
sonar.projectBaseDir=.

# Source and test folders - separate main code from tests
# Only include directories with Python files for analysis
sonar.sources=src
sonar.tests=tests

# Python version
sonar.python.version=3.13

# Analyze only Python files
sonar.inclusions=**/*.py
sonar.test.inclusions=tests/**/*.py

# Exclude non-code files, build artifacts, and configuration
sonar.exclusions=**/.gitignore,**/node_modules/**,**/venv/**,**/__pycache__/**,**/*.pyc,**/.*,**/htmlcov/**,**/*.log,**/logs/**,**/*.json,**/*.xlsx,**/*.md,**/*.txt,**/*.sh,**/*.properties,**/*.ini,**/.pytest_cache/**,**/.deepeval/**,**/docs/**
sonar.test.exclusions=**/conftest.py,**/__init__.py

# Language settings
sonar.language=py
sonar.sourceEncoding=UTF-8

# Unified deterministic-suite coverage report generated by Bamboo.
sonar.python.coverage.reportPaths=artifacts/coverage.xml

# Disable C/C++/Objective-C analysis (Python project only)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Working directory
sonar.working.directory=.scannerwork

# SCM settings - helps with blame information
sonar.scm.provider=git
sonar.scm.forceReloadAll=false
