    question: What’s the maximum I could pay in a year?
    reference_answer: |-
      For in-network covered services, the annual out-of-pocket maximums are:

      Platinum: $5,000
      Gold: $9,200
      Silver: $9,800

      Once you reach this limit, the plan pays 100% of covered services for the rest of the year.

      This amount does not include monthly premiums or services that are not covered.
    source_intent: broad_plans
