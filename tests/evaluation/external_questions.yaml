    question: What happens if I miss Open Enrollment?
    reference_answer: |-
      If you miss Open Enrollment, you may still be able to enroll if you qualify for a Special Enrollment Period.

      Examples include life events like getting married, having a child, losing other health coverage, or moving to a new area.

      If you don’t qualify, you may need to wait until the next Open Enrollment period.

