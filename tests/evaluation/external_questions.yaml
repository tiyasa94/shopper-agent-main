    question: What is the difference between on-marketplace and off-marketplace plans?
    reference_answer: |-
      The main difference is how financial assistance works:

      Marketplace plans: You may qualify for premium subsidies and cost-sharing reductions (if eligible), which can lower your monthly premium and out-of-pocket costs
      Off-marketplace plans: These plans are purchased directly and do not include financial assistance

      Eligibility for savings depends on your income and household size.
    source_intent: generic_info
