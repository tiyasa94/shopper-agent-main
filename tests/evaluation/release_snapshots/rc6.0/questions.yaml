schema_version: 1
name: shopper-behavioral-v2
description: >-
  Manually curated behavioral evaluation for shopper-assistant routing, plan resolution,
  conversational continuity, grounded retrieval, and user-facing usefulness.
curation:
  source: >-
    tests/evaluation/external_questions.yaml, RC4 defect evidence, and independently authored
    regressions
  provenance_policy: >-
    The imported source corpus remains unchanged. This file contains only reviewed examples and
    may rewrite or replace source wording.
  answer_policy: >-
    reference_answer is a concise review aid. For document-backed questions, current retrieved
    evidence remains authoritative and dollar amounts must not be inferred from this corpus.
  routing_policy: >-
    source_intent and source_rag_expected describe the reviewed desired behavior for this corpus.
  presentation_policy: >-
    Clarifications ask the shopper to identify a plan without printing the full allowlist. Unique
    casual plan names are accepted and canonicalized internally.
statistics:
  conversations: 62
  turns: 89
  contexts: 12
  turns_by_market:
    Individual: 37
    Medicare: 52
  multi_turn_conversations: 21

