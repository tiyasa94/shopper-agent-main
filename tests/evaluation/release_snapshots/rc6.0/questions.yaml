conversations:
  - id: behavioral_ind_cost_terms
    market: Individual
    context: individual_prospect
    evaluation_status: eligible
    tags: [general, multiturn, terminology]
    turns:
      - id: behavioral_ind_cost_terms_01
        question: What's a copay?
        reference_answer: A copay is a fixed amount paid for a covered service, such as a visit or prescription.
        source_intent: generic_info
        source_rag_expected: true
        expected_route: general_search
        expected_plan_ids: []
        expected_behavior: Define copay plainly without adding plan-specific dollar amounts.
      - id: behavioral_ind_cost_terms_02
        question: How is that different from a deductible?
        reference_answer: A deductible is an amount paid for covered care before the plan begins paying under its rules; a copay is a fixed charge for a service.
        source_intent: generic_info
        source_rag_expected: true
        expected_route: general_search
        expected_plan_ids: []
        expected_behavior: Preserve the copay antecedent and contrast the two terms concisely.
      - id: behavioral_ind_cost_terms_03
        question: And where does coinsurance fit in?
        reference_answer: Coinsurance is a percentage of the allowed cost paid after any applicable deductible, unlike a fixed copay.
        source_intent: generic_info
        source_rag_expected: true
        expected_route: general_search
        expected_plan_ids: []
        expected_behavior: Explain coinsurance in the established cost-sharing context.

  - id: behavioral_ind_marketplace
    market: Individual
    context: individual_prospect
    evaluation_status: eligible
    tags: [general, marketplace]
    turns:
      - id: behavioral_ind_marketplace_01
        question: What's the difference between marketplace and off-marketplace coverage?
        reference_answer: Marketplace coverage is purchased through an exchange and may qualify for income-based financial assistance; off-marketplace coverage is purchased outside the exchange.
        source_intent: generic_info
        source_rag_expected: true
        expected_route: general_search
        expected_plan_ids: []
        expected_behavior: Explain the exchange and subsidy distinction without claiming personal eligibility.
      - id: behavioral_ind_marketplace_02
        question: How would I know whether I qualify for a subsidy?
        reference_answer: State that the assistant cannot determine whether this shopper qualifies and direct them to the official enrollment application or a licensed agent.
        source_intent: generic_info
        source_rag_expected: false
        expected_route: guardrail
        expected_plan_ids: []
        expected_behavior: Do not make a personal determination or state fixed eligibility thresholds without current authoritative support.

  - id: uat_primary_care_requires_plan_disambiguation
    market: Individual
    context: uat_individual_prospect_primary_care
    evaluation_status: eligible
    tags: [client_uat, plan_disambiguation, recommended_plans]
    source:
      request_id: ff157e2e-5389-4d2c-af4b-321e37346120
      wxo_run_id: 92c46e56-5ae1-45d4-b209-698c3422a1f5
    turns:
      - id: uat_primary_care_requires_plan_disambiguation_turn_01
        question: What would I pay for an in-network primary care visit?
        reference_answer: Ask which available plan the user means before retrieving plan benefits. Do not silently compare only the recommended plans.
        source_intent: specific_plan
        source_rag_expected: false
        expected_route: clarify_plan
        expected_plan_ids: []
        expected_behavior: Preserve the client-reported UAT requirement to ask for a plan instead of assuming either recommended plan.

  - id: behavioral_ind_er_casual_selection
    market: Individual
    context: individual_prospect
    evaluation_status: eligible
    tags: [clarification, multiturn, casual_plan, continuity]
    turns:
      - id: behavioral_ind_er_casual_selection_01
        question: What would I pay for an emergency room visit?
        reference_answer: Ask which plan the shopper means without listing the complete plan catalog.
        source_intent: specific_plan
        source_rag_expected: false
        expected_route: clarify_plan
        expected_plan_ids: []
        expected_behavior: Do not assume the recommended plans and do not retrieve yet.
      - id: behavioral_ind_er_casual_selection_02
        question: The Bronze 60 D EPO.
        reference_answer: Resolve the unique casual name to Anthem Bronze 60 D EPO and answer the pending emergency-room question from current documents.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XX4]
        expected_behavior: Carry forward the emergency-room topic and accept the unique shorthand.
      - id: behavioral_ind_er_casual_selection_03
        question: And urgent care?
        reference_answer: Answer urgent-care cost sharing for Anthem Bronze 60 D EPO from current documents.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XX4]
        expected_behavior: Retain the selected plan while changing only the requested service.

  - id: rc5_stage_bare_both_selection
    market: Individual
    context: rc4_individual_hmo
    evaluation_status: eligible
    tags: [rc5_regression, stage_observed, multiturn, selection_continuation, off_topic]
    source:
      request_id: 7caa5dd7-8128-4d36-80ab-09d93d62fe64
      wxo_run_id: 2c76b23e-cb43-4580-9458-1197f0fed77c
    turns:
      - id: rc5_stage_bare_both_selection_01
        question: Compare Anthem Bronze 60 D HMO and Anthem Platinum 90 D HMO rehabilitation benefits.
        reference_answer: Compare rehabilitation benefits for Anthem Bronze 60 D HMO and Anthem Platinum 90 D HMO using current plan documents.
        source_intent: broad_plans
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XVY, 8XWN]
        expected_behavior: Establish Bronze and Platinum as the active two-plan comparison without substituting recommended plans.
      - id: rc5_stage_bare_both_selection_02
        question: What are the copays for occupational therapy?
        reference_answer: Ask whether the shopper wants the occupational-therapy copay for Bronze, Platinum, or both plans.
        source_intent: specific_plan
        source_rag_expected: false
        expected_route: clarify_plan
        expected_plan_ids: []
        expected_behavior: Preserve the pending occupational-therapy topic and the two compared plans while requesting the shopper's selection.
      - id: rc5_stage_bare_both_selection_03
        question: both
        reference_answer: Treat the reply as selecting both previously discussed plans and answer the pending occupational-therapy copay comparison from current evidence.
        source_intent: broad_plans
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XVY, 8XWN]
        expected_behavior: Do not classify the ambiguous selection reply as off-topic, availability, or general information; preserve native conversation continuity.

  - id: behavioral_ind_personal_premium
    market: Individual
    context: individual_member_current_plan
    evaluation_status: eligible
    tags: [member, current_plan, personalized_boundary, multiturn]
    turns:
      - id: behavioral_ind_personal_premium_01
        question: Why did my monthly premium go up?
        reference_answer: Briefly acknowledge the premium-change concern, state that the assistant cannot determine why this shopper's personal outcome occurred, offer supported plan-fact help, and direct the member to their notice or Member Services for the exact reason.
        source_intent: specific_plan
        source_rag_expected: false
        expected_route: guardrail
        expected_plan_ids: []
        expected_behavior: Use the terminal custom-plus-canned boundary without retrieval; acknowledge only the general outcome type and do not infer a cause.
      - id: behavioral_ind_personal_premium_02
        question: What notice does the plan say I should receive?
        reference_answer: The documents state that written notice of a premium change is sent 60 days before renewal.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XWE]
        expected_behavior: Retain the current plan and answer the narrower documented rule.

  - id: behavioral_ind_correction
    market: Individual
    context: individual_member_current_plan
    evaluation_status: eligible
    tags: [member, current_plan, correction, multiturn]
    turns:
      - id: behavioral_ind_correction_01
        question: What's the urgent-care cost on my plan?
        reference_answer: Answer urgent-care cost sharing for Anthem Silver 70 Off Exchange EPO from current documents.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XWE]
        expected_behavior: Resolve my plan to the authoritative current plan.
      - id: behavioral_ind_correction_02
        question: Sorry, I meant the plan's medical deductible.
        reference_answer: Answer the medical-deductible question for the same current plan from current documents.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XWE]
        expected_behavior: Retain the plan and replace the urgent-care topic with medical deductible.

  - id: behavioral_ind_named_telehealth
    market: Individual
    context: individual_prospect
    evaluation_status: eligible
    tags: [named_plan, retrieval]
    turns:
      - id: behavioral_ind_named_telehealth_01
        question: Does Anthem Bronze 60 D EPO cover virtual visits?
        reference_answer: Answer virtual-care coverage and cost conditions for Anthem Bronze 60 D EPO using only current plan documents.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XX4]
        expected_behavior: Search only the explicitly named plan and preserve any provider or network qualification.

  - id: behavioral_ind_unique_silver
