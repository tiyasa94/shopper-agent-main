        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XW4, 8XWR]
        expected_behavior: Search exactly the two named plans; do not recommend one.
      - id: behavioral_ind_comparison_02
        question: Which one has the lower out-of-pocket maximum?
        reference_answer: Compare the out-of-pocket maximum for the same two plans using current evidence.
        source_intent: broad_plans
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XW4, 8XWR]
        expected_behavior: Retain the two-plan set and change the comparison fact.

  - id: behavioral_ind_recommendation
    market: Individual
    context: individual_prospect
