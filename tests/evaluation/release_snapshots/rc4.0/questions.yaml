        question: Why did my monthly premium go up?
        reference_answer: Explain that plan documents cannot identify the cause of this shopper's increase, then give only relevant documented premium-change rules and direct them to member services for the personal explanation.
        source_intent: specific_plan
        source_rag_expected: true
        expected_route: plan_search
        expected_plan_ids: [8XWE]
        expected_behavior: Use the authoritative current plan and apply the personalized-outcome boundary.
      - id: behavioral_ind_personal_premium_02
