        reference_answer: Marketplace coverage is purchased through an exchange and may qualify for income-based financial assistance; off-marketplace coverage is purchased outside the exchange.
        source_intent: generic_info
        source_rag_expected: true
        expected_route: general_search
        expected_plan_ids: []
        expected_behavior: Explain the exchange and subsidy distinction without claiming personal eligibility.
