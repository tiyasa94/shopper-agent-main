schema_version: 1
name: shopper-english-only-v1
description: English-only regression cases for multilingual questions, requested output language, context
  preference, follow-ups, plan responses, clarifications, and composed guardrails. Review complete response
  bodies, not just English headings. This corpus uses synthetic contexts.
