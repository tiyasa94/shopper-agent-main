    source_row: 13
    source_question_number: 12
    question: Explain a health insurance deductible in simple terms.
    reference_answer: 'An amount you could owe during a coverage period (usually one year) for covered health care
      services before your plan begins to pay. An overall deductible applies to all or almost all covered items
      and services. A plan with an overall deductible may also have separate deductibles that apply to specific
      services or groups of services. A plan may also have only separate deductibles. (For example, if your deductible
      is $1000, your plan won’t pay anything until you’ve met your $1000 deductible for covered health care services
      subject to the deductible.) See a detailed example. LoK: agree - we want to match what is in supporting docs/click
      ins'
    source_intent: generic_info
    source_rag_expected: true
    evaluation_status: eligible
    prompt_overlap: []
    expected_route: general_search
    expected_behavior: Use the market-specific general corpus and answer only from responsive evidence.
    expected_plan_ids: []
