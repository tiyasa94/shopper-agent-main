[config_map]
WO_ENVIRONMENT_NAME = "local"
# Local tools use the same cloud WXO inference gateway, with service IAM auth.
WXO_API_URL = "https://api.us-south.watson-orchestrate.cloud.ibm.com/instances/c32fc9ba-3122-4c61-a9b0-1d4aa43c9980"
WXO_MODEL_ID = "watsonx/openai/gpt-oss-120b"
WXO_IAM_URL = "https://iam.cloud.ibm.com/identity/token"
RAG_IOLS_ENDPOINT = "/retrieve/iols"
RAG_MOLS_ENDPOINT = "/retrieve/mols"
RAG_IOLS_GENERAL_ENDPOINT = "/retrieve/iols/general"
RAG_MOLS_GENERAL_ENDPOINT = "/retrieve/mols/general"
RAG_PLANS_ENDPOINT = "/plans/quote"

[connections]
specs = ["src/rag_api_connection.local.yaml", "src/wxo_connection.local.yaml"]

[connections.credentials."elevance-rag-tool-anthem"]
envs = ["draft"]
secret_vars = ["RAG_API_KEY"]
manifest_vars = ["RAG_IOLS_ENDPOINT", "RAG_MOLS_ENDPOINT", "RAG_IOLS_GENERAL_ENDPOINT", "RAG_MOLS_GENERAL_ENDPOINT", "RAG_PLANS_ENDPOINT"]

[connections.credentials."elevance-wxo-inference"]
envs = ["draft"]
secret_vars = ["WXO_API_KEY"]
manifest_vars = ["WXO_API_URL", "WXO_MODEL_ID", "WXO_IAM_URL"]

[tools]
dir = "src/tools"
requirements = "src/requirements.txt"
package_dir = "src"
app_ids = {"plan_details.py" = "elevance-rag-tool-anthem", "plan_search.py" = "elevance-rag-tool-anthem", "general_search.py" = "elevance-rag-tool-anthem", "guardrail_plugin.py" = "elevance-wxo-inference", "addendum_plugin.py" = ""}

[agents]
files = ["src/agent.yaml"]
