name: shopper-local

services:
  postgres:
    image: docker.io/library/postgres:18.4-alpine
    environment:
      POSTGRES_DB: shopper_assistant
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: shopper_assistant
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopper_assistant -d shopper_assistant"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - shopper-postgres-data:/var/lib/postgresql

  rag-api:
    build:
      context: ${SHOPPER_PLATFORM_ROOT}/apps/rag-api
      target: runtime
    ports:
      # WXO runs in a separate Lima VM and reaches this published port through
      # host.lima.internal, so RAG cannot be bound only to host loopback.
      - "${LOCAL_RAG_BIND_ADDRESS:-0.0.0.0}:${LOCAL_RAG_API_PORT:-8081}:8080"
    restart: "on-failure:3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 30

  shopper-api:
    build:
      context: ${SHOPPER_PLATFORM_ROOT}/apps/shopper-assistant-api
      target: runtime
    command:
      - sh
      - -c
      - >-
        python -m app.jobs.schema_apply &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LOCAL_SHOPPER_API_PORT:-8082}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  shopper-postgres-data:
